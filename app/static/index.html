<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Parser — Test Console</title>
<style>
  :root {
    --bg: oklch(16% 0.012 250);
    --bg-2: oklch(20% 0.014 250);
    --surface: oklch(23% 0.016 252);
    --surface-2: oklch(27% 0.018 252);
    --line: oklch(34% 0.02 252);
    --text: oklch(94% 0.006 250);
    --muted: oklch(72% 0.012 252);
    --faint: oklch(58% 0.012 252);
    --accent: oklch(78% 0.15 78);
    --accent-dim: oklch(62% 0.12 78);
    --ok: oklch(72% 0.16 150);
    --bad: oklch(64% 0.18 25);
    --warn: oklch(78% 0.15 78);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Inter", sans-serif;
    --radius: 10px;
    --dur: 180ms;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 80% -10%, oklch(24% 0.03 78 / 0.18), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.5rem); }

  /* Header */
  header {
    border-bottom: 1px solid var(--line);
    background: oklch(15% 0.012 250 / 0.7);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .head-row { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 0; }
  .brand { display: flex; flex-direction: column; gap: 0.15rem; }
  .brand h1 {
    font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: -0.01em;
  }
  .brand .tag {
    font-family: var(--mono); font-size: 0.7rem; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  .spacer { flex: 1; }
  .pill {
    font-family: var(--mono); font-size: 0.74rem; padding: 0.35rem 0.7rem;
    border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 0.45rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 0 transparent; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px -1px var(--ok); }
  .dot.bad { background: var(--bad); }

  main { padding: clamp(1.5rem, 4vw, 3rem) 0 5rem; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: clamp(1rem, 2.5vw, 2rem); align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel > .panel-head {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 {
    margin: 0; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .panel-head .num { font-family: var(--mono); font-size: 0.7rem; color: var(--accent-dim); }
  .panel-body { padding: 1.1rem; }

  .side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 1rem; }

  /* Config rows */
  .kv { display: flex; flex-direction: column; gap: 0.55rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .row .k { font-size: 0.82rem; color: var(--muted); }
  .row .v { font-family: var(--mono); font-size: 0.8rem; color: var(--text); }
  .chip {
    font-family: var(--mono); font-size: 0.72rem; padding: 0.18rem 0.5rem;
    border-radius: 6px; border: 1px solid var(--line); display: inline-flex;
    align-items: center; gap: 0.4rem; background: var(--surface-2);
  }
  .chip.on { color: var(--ok); border-color: oklch(40% 0.08 150); }
  .chip.off { color: var(--faint); }
  .divider { height: 1px; background: var(--line); margin: 0.9rem 0; border: 0; }
  .sub-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); margin: 0 0 0.5rem; }

  /* Controls */
  label.field { display: block; margin-bottom: 0.95rem; }
  label.field > span {
    display: block; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--faint); margin-bottom: 0.4rem;
  }
  select, input[type="number"], input[type="file"] {
    width: 100%; font-family: var(--mono); font-size: 0.85rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 0.6rem 0.7rem; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  select:focus, input:focus {
    outline: none; border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px oklch(78% 0.15 78 / 0.16);
  }
  input[type="file"] { padding: 0.45rem; cursor: pointer; }
  input[type="file"]::file-selector-button {
    font-family: var(--mono); font-size: 0.78rem; margin-right: 0.7rem;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 6px; padding: 0.35rem 0.6rem; cursor: pointer;
  }

  .seg { display: flex; gap: 0.4rem; }
  .seg button {
    flex: 1; font-family: var(--mono); font-size: 0.8rem; cursor: pointer;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 0.55rem; transition: all var(--dur) var(--ease);
  }
  .seg button[aria-pressed="true"] {
    background: oklch(78% 0.15 78 / 0.12); color: var(--accent); border-color: var(--accent-dim);
  }
  .seg button:hover { border-color: var(--accent-dim); }

  .run {
    width: 100%; margin-top: 0.4rem; cursor: pointer;
    font-family: var(--sans); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.01em;
    color: oklch(18% 0.02 78); background: linear-gradient(180deg, var(--accent), var(--accent-dim));
    border: 0; border-radius: 9px; padding: 0.75rem; transition: transform var(--dur) var(--ease), filter var(--dur) var(--ease);
  }
  .run:hover:not(:disabled) { filter: brightness(1.08); }
  .run:active:not(:disabled) { transform: translateY(1px); }
  .run:disabled { opacity: 0.5; cursor: progress; }

  .hidden { display: none !important; }

  /* Results */
  .results { display: flex; flex-direction: column; gap: 1rem; }
  .placeholder {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 3rem 1.5rem; text-align: center; color: var(--faint);
    font-family: var(--mono); font-size: 0.82rem;
  }
  .err {
    border: 1px solid oklch(45% 0.12 25); background: oklch(30% 0.06 25 / 0.4);
    color: oklch(86% 0.06 25); border-radius: var(--radius); padding: 1rem 1.1rem;
    font-family: var(--mono); font-size: 0.82rem; white-space: pre-wrap;
  }
  .stat-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .stat {
    flex: 1 1 120px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 0.75rem 0.85rem;
  }
  .stat .n { font-family: var(--mono); font-size: 1.35rem; color: var(--accent); letter-spacing: -0.01em; }
  .stat .l { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); margin-top: 0.15rem; }

  .page {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden;
  }
  .page-head {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.7rem 0.95rem; background: var(--surface-2); border-bottom: 1px solid var(--line);
  }
  .page-head .pno { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .badge {
    font-family: var(--mono); font-size: 0.68rem; padding: 0.15rem 0.45rem; border-radius: 5px;
    border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .badge.hw { color: var(--warn); border-color: oklch(45% 0.1 78); }
  .conf { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
  .conf .bar { width: 80px; height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .conf .bar > i { display: block; height: 100%; background: var(--accent); }
  .conf .pct { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); min-width: 34px; text-align: right; }
  .md {
    margin: 0; padding: 0.9rem 1rem; font-family: var(--mono); font-size: 0.78rem;
    color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
  }
  .notes { padding: 0 1rem 0.8rem; color: var(--faint); font-size: 0.74rem; }

  /* QA */
  .qa-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.95rem 1.05rem; }
  .qa-q { font-weight: 600; color: var(--text); margin: 0 0 0.45rem; }
  .qa-a { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.6rem; }
  .qa-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .qa-caveat { margin-top: 0.6rem; font-size: 0.78rem; color: var(--warn); border-left: 2px solid oklch(45% 0.1 78); padding-left: 0.6rem; }

  .toolbar { display: flex; align-items: center; gap: 0.6rem; }
  .toolbar h2 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
  .ghost {
    font-family: var(--mono); font-size: 0.74rem; cursor: pointer; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 0.35rem 0.6rem;
    transition: all var(--dur) var(--ease);
  }
  .ghost:hover { border-color: var(--accent-dim); color: var(--accent); }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div class="brand">
      <h1>Intelligent PDF Parser</h1>
      <span class="tag">Test Console</span>
    </div>
    <div class="spacer"></div>
    <span id="health" class="pill"><span class="dot"></span> checking…</span>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <!-- Sidebar: config + run -->
    <div class="side">
      <section class="panel" aria-labelledby="cfg-h">
        <div class="panel-head">
          <span class="num">01</span><h2 id="cfg-h">Agent Configuration</h2>
          <div class="spacer" style="flex:1"></div>
          <button id="cfg-refresh" class="ghost" title="Reload config">↻</button>
        </div>
        <div class="panel-body" id="cfg-body">
          <div class="placeholder" style="padding:1.5rem">loading…</div>
        </div>
      </section>

      <section class="panel" aria-labelledby="run-h">
        <div class="panel-head"><span class="num">02</span><h2 id="run-h">Run</h2></div>
        <div class="panel-body">
          <label class="field">
            <span>Source</span>
            <div class="seg" role="group" aria-label="Source">
              <button type="button" data-src="sample" aria-pressed="true">Sample</button>
              <button type="button" data-src="upload" aria-pressed="false">Upload</button>
            </div>
          </label>

          <label class="field" id="sample-field">
            <span>Sample PDF</span>
            <select id="sample-select"><option>loading…</option></select>
          </label>

          <label class="field hidden" id="upload-field">
            <span>PDF file</span>
            <input type="file" id="file-input" accept="application/pdf,.pdf" />
          </label>

          <label class="field">
            <span>Mode</span>
            <div class="seg" role="group" aria-label="Mode">
              <button type="button" data-mode="parse" aria-pressed="true">Parse only</button>
              <button type="button" data-mode="process" aria-pressed="false">Parse + Q&amp;A</button>
            </div>
          </label>

          <label class="field hidden" id="nq-field">
            <span>Questions</span>
            <input type="number" id="num-questions" value="12" min="1" max="40" />
          </label>

          <button class="run" id="run-btn">Run parse</button>
        </div>
      </section>
    </div>

    <!-- Results -->
    <section aria-labelledby="res-h">
      <div class="toolbar" style="margin-bottom:1rem">
        <h2 id="res-h">Results</h2>
        <div class="spacer" style="flex:1"></div>
        <span id="res-source" class="pill hidden"></span>
      </div>
      <div class="results" id="results">
        <div class="placeholder">No run yet. Pick a sample and hit <strong style="color:var(--accent)">Run</strong>.</div>
      </div>
    </section>
  </div>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const kb = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : (n / 1024).toFixed(0) + " KB";

const state = { src: "sample", mode: "parse" };

/* ---- Health ---- */
async function loadHealth() {
  const el = $("#health");
  try {
    const r = await fetch("/health"); const d = await r.json();
    el.innerHTML = `<span class="dot ok"></span> ${esc(d.status)} · v${esc(d.version)} · ${esc(d.env)}`;
  } catch {
    el.innerHTML = `<span class="dot bad"></span> offline`;
  }
}

/* ---- Config ---- */
function chip(on, label) {
  return `<span class="chip ${on ? "on" : "off"}"><span class="dot ${on ? "ok" : "bad"}"></span>${esc(label)}</span>`;
}
async function loadConfig() {
  const body = $("#cfg-body");
  body.innerHTML = `<div class="placeholder" style="padding:1.5rem">loading…</div>`;
  try {
    const d = await (await fetch("/config")).json();
    const b = d.backends_available || {};
    body.innerHTML = `
      <div class="kv">
        <div class="row"><span class="k">Parser backend</span><span class="v">${esc(d.parser_backend)}</span></div>
        <div class="row"><span class="k">Force vision LLM</span><span class="v">${d.force_vision_llm ? "on" : "off"}</span></div>
        <div class="row"><span class="k">Confidence threshold</span><span class="v">${esc(d.confidence_threshold)}</span></div>
      </div>
      <hr class="divider" />
      <p class="sub-label">Parser backends</p>
      <div class="kv">
        <div class="row"><span class="k">Docling</span>${chip(b.docling, b.docling ? "ready" : "n/a")}</div>
        <div class="row"><span class="k">LlamaParse</span>${chip(b.llamaparse, b.llamaparse ? "ready" : "n/a")}</div>
        <div class="row"><span class="k">Vision LLM</span>${chip(b.vision_llm, b.vision_llm ? "ready" : "n/a")}</div>
      </div>
      <hr class="divider" />
      <p class="sub-label">Providers</p>
      <div class="kv">
        <div class="row"><span class="k">LLM (${esc(d.llm_provider)})</span>${chip(d.llm_provider_available, d.llm_provider_available ? "ready" : "no key")}</div>
        <div class="row"><span class="k">Vision provider</span><span class="v">${esc(d.vision_provider)}</span></div>
      </div>`;
  } catch (e) {
    body.innerHTML = `<div class="err">config error: ${esc(e.message)}</div>`;
  }
}

/* ---- Samples ---- */
async function loadSamples() {
  const sel = $("#sample-select");
  try {
    const d = await (await fetch("/samples")).json();
    const list = d.samples || [];
    if (!list.length) { sel.innerHTML = `<option value="">no samples on server</option>`; return; }
    sel.innerHTML = list.map(s => `<option value="${esc(s.name)}">${esc(s.name)} · ${kb(s.size_bytes)}</option>`).join("");
  } catch (e) {
    sel.innerHTML = `<option value="">error loading samples</option>`;
  }
}

/* ---- Segmented controls ---- */
$$('.seg button[data-src]').forEach(b => b.addEventListener("click", () => {
  state.src = b.dataset.src;
  $$('.seg button[data-src]').forEach(x => x.setAttribute("aria-pressed", x === b));
  $("#sample-field").classList.toggle("hidden", state.src !== "sample");
  $("#upload-field").classList.toggle("hidden", state.src !== "upload");
}));
$$('.seg button[data-mode]').forEach(b => b.addEventListener("click", () => {
  state.mode = b.dataset.mode;
  $$('.seg button[data-mode]').forEach(x => x.setAttribute("aria-pressed", x === b));
  $("#nq-field").classList.toggle("hidden", state.mode !== "process");
  $("#run-btn").textContent = state.mode === "process" ? "Run parse + Q&A" : "Run parse";
}));

/* ---- Render results ---- */
function pct(c) { return Math.round((c || 0) * 100); }
function renderPages(parse) {
  return parse.pages.map(p => {
    const hw = p.has_handwriting ? `<span class="badge hw">handwriting</span>` : "";
    const notes = (p.notes || []).length ? `<div class="notes">⚐ ${p.notes.map(esc).join(" · ")}</div>` : "";
    return `<article class="page">
      <div class="page-head">
        <span class="pno">p${p.page_number}</span>
        <span class="badge">${esc(p.backend || "—")}</span>
        <span class="badge">${esc(p.kind)}</span>${hw}
        <span class="conf"><span class="bar"><i style="width:${pct(p.confidence)}%"></i></span><span class="pct">${pct(p.confidence)}%</span></span>
      </div>
      <pre class="md">${esc(p.markdown) || "<span style='color:var(--faint)'>(empty)</span>"}</pre>
      ${notes}
    </article>`;
  }).join("");
}
function renderQA(qa) {
  if (!qa) return "";
  const items = (qa.items || []).map(it => `
    <article class="qa-item">
      <p class="qa-q">${esc(it.question)}</p>
      <p class="qa-a">${esc(it.answer)}</p>
      <div class="qa-meta">
        <span class="badge">${esc(it.category)}</span>
        <span class="badge">conf: ${esc(it.confidence)}</span>
        <span class="badge">pages: ${(it.source_pages || []).join(", ") || "—"}</span>
      </div>
      ${it.caveat ? `<div class="qa-caveat">⚠️ ${esc(it.caveat)}</div>` : ""}
    </article>`).join("");
  const head = [qa.company, qa.period].filter(Boolean).map(esc).join(" — ");
  return `<section class="panel"><div class="panel-head"><span class="num">QA</span><h2>${esc(qa.title || "Q&A")}${head ? " · " + head : ""}</h2></div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:0.8rem">${items || "<div class='placeholder'>no items</div>"}</div></section>`;
}
function render(resp) {
  const parse = resp.parse;
  const t = resp.timings_ms || {};
  const bs = parse.backend_summary || {};
  const summary = Object.entries(bs).map(([k, v]) => `${k}:${v}`).join("  ") || "—";
  const stats = `
    <div class="stat-row">
      <div class="stat"><div class="n">${parse.page_count}</div><div class="l">pages</div></div>
      <div class="stat"><div class="n">${t.parse ?? "—"}</div><div class="l">parse ms</div></div>
      ${t.qa != null ? `<div class="stat"><div class="n">${t.qa}</div><div class="l">q&a ms</div></div>` : ""}
      <div class="stat"><div class="n" style="font-size:0.95rem;line-height:1.9">${esc(summary)}</div><div class="l">backends</div></div>
    </div>`;
  const warns = (parse.warnings || []).length
    ? `<div class="err" style="border-color:oklch(45% 0.1 78);background:oklch(28% 0.04 78 / .35);color:var(--warn)">⚠ ${parse.warnings.map(esc).join("\n")}</div>` : "";
  $("#results").innerHTML = stats + warns + renderQA(resp.qa) +
    `<section class="panel"><div class="panel-head"><span class="num">PG</span><h2>Pages</h2></div>
     <div class="panel-body" style="display:flex;flex-direction:column;gap:0.8rem">${renderPages(parse)}</div></section>`;

  const src = $("#res-source");
  src.classList.remove("hidden");
  src.innerHTML = `<span class="dot ok"></span> ${esc(parse.source_filename)}`;
}

/* ---- Run ---- */
async function run() {
  const btn = $("#run-btn");
  const results = $("#results");
  let url, body;
  if (state.src === "sample") {
    const name = $("#sample-select").value;
    if (!name) { results.innerHTML = `<div class="err">No sample selected.</div>`; return; }
    body = new FormData();
    body.append("name", name);
    url = state.mode === "process" ? "/process/sample" : "/parse/sample";
  } else {
    const f = $("#file-input").files[0];
    if (!f) { results.innerHTML = `<div class="err">Choose a PDF file first.</div>`; return; }
    body = new FormData();
    body.append("file", f);
    url = state.mode === "process" ? "/process" : "/parse";
  }
  if (state.mode === "process") body.append("num_questions", $("#num-questions").value || "12");

  const label = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = `<span class="spin" style="display:inline-block">↻</span> running…`;
  results.innerHTML = `<div class="placeholder">parsing… vision-LLM pages can take a while</div>`;
  try {
    const r = await fetch(url, { method: "POST", body });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    render(data);
  } catch (e) {
    results.innerHTML = `<div class="err">Run failed:\n${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

$("#run-btn").addEventListener("click", run);
$("#cfg-refresh").addEventListener("click", loadConfig);

loadHealth();
loadConfig();
loadSamples();
</script>
</body>
</html>
