<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intelligent PDF Parser</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">P</div>
      <div>
        <h1>PDF Parser</h1>
        <span class="tag">Test Console</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/new" data-route="new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New Run
      </a>
      <a href="#/history" data-route="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        Run History
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="spacer"></div>
    <div class="health" id="health"><span class="dot"></span> checking…</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="view-title">…</h2>
        <div class="crumb" id="view-crumb"></div>
      </div>
      <div class="grow"></div>
      <div id="topbar-actions"></div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="toast-wrap" id="toasts"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
